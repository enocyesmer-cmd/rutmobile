<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutmovil</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Rutas y expresos de transporte en tiempo real. Elige la ruta que mejor te lleve en tu viaje.">
<meta name="theme-color" content="#1423ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1018c9" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutmovil">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('rutmovil-tema');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="map.css">
</head>
<body>

<header class="hero">
  <span class="shape s1"></span><span class="shape s2"></span>
  <div class="road" aria-hidden="true">
    <svg class="bus-deco" width="56" height="28" viewBox="0 0 64 32">
      <g class="bus-body">
        <rect x="2" y="3" width="58" height="20" rx="5" fill="#ffffff"/>
        <rect x="7" y="7" width="9" height="8" rx="2" fill="#38b6ff"/>
        <rect x="19" y="7" width="9" height="8" rx="2" fill="#38b6ff"/>
        <rect x="31" y="7" width="9" height="8" rx="2" fill="#38b6ff"/>
        <rect x="44" y="7" width="12" height="9" rx="2" fill="#38b6ff"/>
        <rect x="4" y="17" width="54" height="3" fill="#1423ff"/>
        <rect x="58" y="16" width="4" height="3" rx="1" fill="#ffd84d"/>
        <g class="wheel"><circle cx="16" cy="24" r="5.5" fill="#0a0f33" stroke="#ffffff" stroke-width="1.5"/><path d="M16 20.5v7M12.5 24h7" stroke="#ffffff" stroke-width="1.2"/></g>
        <g class="wheel"><circle cx="48" cy="24" r="5.5" fill="#0a0f33" stroke="#ffffff" stroke-width="1.5"/><path d="M48 20.5v7M44.5 24h7" stroke="#ffffff" stroke-width="1.2"/></g>
      </g>
    </svg>
  </div>
  <div class="gut">
    <div class="top">
      <div class="brand">
        <svg class="mark" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
          <rect width="44" height="44" rx="12" fill="#ffffff"/>
          <path class="m-path" pathLength="1" d="M12 32 C12 22 22 24 22 16 C22 12 26 11 32 12" fill="none" stroke="#1423ff" stroke-width="3.5" stroke-linecap="round"/>
          <circle class="m-a" cx="12" cy="32" r="4" fill="#1423ff"/>
          <circle class="m-b" cx="32" cy="12" r="4" fill="#38b6ff"/>
        </svg>
        <h1>Rutmovil</h1>
      </div>
      <div class="top-r">
        <div class="live"><span class="dot"></span>En vivo<span class="clock" id="clock"></span></div>
        <button class="themebtn" id="instalar" hidden aria-label="Instalar Rutmovil" title="Instalar Rutmovil">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="transform:none;opacity:1"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" stroke-linejoin="round"/></svg>
        </button>
        <button class="themebtn" id="theme" aria-pressed="false" aria-label="Modo oscuro" title="Modo oscuro">
          <svg class="ico-moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" stroke-linejoin="round"/></svg>
          <svg class="ico-sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <p class="tag">Bienvenido a Rutmovil. Elige la ruta o el expreso que mejor te lleve en tu viaje.</p>
    <div class="tabs" role="tablist" aria-label="Tipo de transporte">
      <span class="pill" aria-hidden="true"></span>
      <button role="tab" id="tab-rutas" aria-selected="true" aria-controls="view-rutas">Rutas</button>
      <button role="tab" id="tab-expresos" aria-selected="false" aria-controls="view-expresos">Expresos</button>
    </div>
  </div>
</header>

<main class="gut">
  <div class="tools">
    <input type="search" id="q" placeholder="Buscar ruta o parada" aria-label="Buscar">
    <button class="favbtn" id="favonly" aria-pressed="false">★ Mis rutas</button>
    <select id="orden" aria-label="Ordenar rutas">
      <option value="normal">Orden: predeterminado</option>
      <option value="pronto">Llega más pronto</option>
      <option value="fav">Favoritas primero</option>
    </select>
  </div>

  <section id="view-rutas" role="tabpanel" aria-labelledby="tab-rutas">
    <div class="sec-h"><h2>Rutas en tiempo real</h2><span id="rcount"></span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-expresos" role="tabpanel" aria-labelledby="tab-expresos" hidden>
    <div class="sec-h"><h2>Salidas de expresos</h2><span id="ecount"></span></div>
    <div class="chips" id="terminales" role="group" aria-label="Filtrar por terminal">
      <button class="tchip" data-t="" aria-pressed="true">Todas</button>
      <button class="tchip" data-t="Huembes" aria-pressed="false">Huembes</button>
      <button class="tchip" data-t="Mayoreo" aria-pressed="false">Mayoreo</button>
      <button class="tchip" data-t="Israel Lewites" aria-pressed="false">Israel Lewites</button>
    </div>
    <div class="grid" id="board"></div>
  </section>

  <p class="foot">Datos de ejemplo: los buses y las salidas se simulan en esta página. Para ver unidades reales hay que conectar Rutmovil a la fuente de datos de las rutas.</p>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="script.js"></script>
<script src="nicaragua.js"></script>
<script src="map.js"></script>
</body>
</html>
